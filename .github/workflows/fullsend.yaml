# Based on fullsend scaffold; customized for review-only, auto-triggered operation.
# The review agent runs automatically on non-draft pull requests; all other
# agents are disabled. Re-apply these changes after any fullsend upgrade.
# Upstream: https://github.com/fullsend-ai/fullsend/blob/main/internal/scaffold/fullsend-repo/.github/workflows/fullsend.yaml
---
# fullsend shim workflow (per-repo installation mode)
# Routes events to agent workflows via reusable-dispatch.yml.
# All agent execution happens in this repo's context — no external
# config repo is needed.
#
# Security: pull_request_target runs the BASE branch version of this workflow,
# preventing PRs from modifying it to exfiltrate credentials.
# This shim never checks out PR code, so it is not vulnerable to "pwn request"
# attacks.
#
# Routing: this shim forwards the raw event context to reusable-dispatch.yml,
# which determines the stage and runs the agent inline (ADR 62).
# Adding a new stage requires only a job in reusable-dispatch.yml — zero changes to this repo.
#
# Concurrency: per-role cancel-in-progress groups live in reusable-dispatch.yml
# stage jobs with -agent- suffix. Roles operate independently (#2452).
name: fullsend

# Trimmed to the events that route to the review stage. Dropped from the
# scaffold: `issues` (triage/code stages), `pull_request_target: closed`
# (retro stage), and `pull_request_review` (fix-agent handoff).
#
# `synchronize` is also dropped deliberately: it would re-review on every push.
# Review runs once when a PR opens or leaves draft; re-review afterwards is
# explicit, via /fs-review or the ready-for-review label.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  dispatch:
    # Draft gate: upstream routing has no draft handling, and `opened` fires on
    # draft PRs. Automatic review is therefore restricted to non-drafts;
    # `ready_for_review` picks the PR up the moment it leaves draft. Label
    # triggers and /fs- commands are explicit human actions and bypass the gate
    # so a draft can still be reviewed on request.
    if: >-
      (github.event_name != 'pull_request_target'
       || github.event.pull_request.head.ref != 'fullsend/scaffold-install')
      && (github.event_name != 'pull_request_target'
       || github.event.action == 'labeled'
       || github.event.action == 'unlabeled'
       || github.event.pull_request.draft == false)
      && (github.event_name != 'issue_comment'
       || (startsWith(github.event.comment.body, '/fs-')
           && github.event.comment.user.type != 'Bot'))
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@d5f36921ac754705619f38c637ef692873809fbc # v0.43.0
    with:
      event_action: ${{ github.event.action }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
